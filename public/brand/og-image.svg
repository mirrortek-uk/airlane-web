<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Flight lines decoration -->
  <g opacity="0.15" stroke="#6366f1" stroke-width="1" fill="none">
    <path d="M 0 200 Q 300 150 600 180 T 1200 160"/>
    <path d="M 0 280 Q 300 230 600 260 T 1200 240"/>
    <path d="M 0 360 Q 300 310 600 340 T 1200 320"/>
    <path d="M 0 440 Q 300 390 600 420 T 1200 400"/>
  </g>
  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <text x="0" y="50" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="700" fill="#f8fafc">AirLane</text>
  </g>
  <!-- Main title -->
  <text x="80" y="280" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="700" fill="#f8fafc">AirLane</text>
  <text x="80" y="340" font-family="'Space Grotesk', sans-serif" font-size="42" font-weight="500" fill="url(#accent)">Visual Traffic Scheduling Client</text>
  <!-- Subtitle -->
  <text x="80" y="400" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="400" fill="#94a3b8">Import subscriptions, manage app-based traffic splitting,</text>
  <text x="80" y="432" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="400" fill="#94a3b8">policy rules, node resource pools, and automatic routing.</text>
  <!-- Feature tags -->
  <g transform="translate(80, 500)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)"/>
    <text x="90" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#a5b4fc">sing-box powered</text>
    <rect x="200" y="0" width="140" height="36" rx="18" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)"/>
    <text x="270" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#fcd34d">Clash compatible</text>
    <rect x="360" y="0" width="100" height="36" rx="18" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.3)"/>
    <text x="410" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#7dd3fc">38+ protocols</text>
    <rect x="480" y="0" width="80" height="36" rx="18" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.3)"/>
    <text x="520" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#c4b5fd">Mesh</text>
  </g>
  <!-- URL -->
  <text x="80" y="580" font-family="'JetBrains Mono', monospace" font-size="16" fill="#64748b">airlane.cloud</text>
</svg>
