<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="560" fill="#f8fafc" rx="16"/>
  <text x="450" y="42" font-family="'Space Grotesk',sans-serif" font-size="21" font-weight="700" fill="#1e293b" text-anchor="middle">Protocol map 2027: stealth × efficiency</text>

  <!-- axes -->
  <line x1="90" y1="480" x2="840" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrQ)"/>
  <line x1="90" y1="480" x2="90" y2="70" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrQ)"/>
  <text x="465" y="520" font-family="'Space Grotesk',sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Disguise strength (DPI resistance) →</text>
  <text x="40" y="280" font-family="'Space Grotesk',sans-serif" font-size="16" fill="#64748b" text-anchor="middle" transform="rotate(-90 40 280)">Transport efficiency →</text>

  <!-- zone labels -->
  <text x="780" y="100" font-family="'Space Grotesk',sans-serif" font-size="14" fill="#16a34a" text-anchor="end">Top-right = real + fast (2027 picks)</text>
  <rect x="560" y="80" width="270" height="400" rx="12" fill="#22c55e" opacity="0.05"/>

  <!-- bubbles -->
  <g font-family="'Space Grotesk',sans-serif" text-anchor="middle">
    <circle cx="150" cy="300" r="34" fill="#cbd5e1" opacity="0.7"/><text x="150" y="296" font-size="13" fill="#334155">OpenVPN</text><text x="150" y="312" font-size="11" fill="#475569">IKEv2</text>
    <circle cx="185" cy="140" r="30" fill="#a5b4fc" opacity="0.6"/><text x="185" y="136" font-size="13" fill="#3730a3">WireGuard</text><text x="185" y="152" font-size="10" fill="#4338ca">fast, obvious</text>
    <circle cx="255" cy="195" r="28" fill="#d4d4d8" opacity="0.7"/><text x="255" y="190" font-size="13" fill="#3f3f46">SS</text><text x="255" y="206" font-size="10" fill="#52525b">light classic</text>
    <circle cx="300" cy="255" r="26" fill="#d4d4d8" opacity="0.6"/><text x="300" y="251" font-size="13" fill="#3f3f46">SS-2022</text><text x="300" y="267" font-size="10" fill="#52525b">SS refresh</text>
    <circle cx="230" cy="390" r="26" fill="#e7e5e4" opacity="0.7"/><text x="230" y="386" font-size="13" fill="#57534e">SSR</text><text x="230" y="402" font-size="10" fill="#78716c">abandoned</text>
    <circle cx="380" cy="330" r="30" fill="#e7e5e4" opacity="0.7"/><text x="380" y="326" font-size="13" fill="#44403c">VMess</text><text x="380" y="342" font-size="10" fill="#57534e">identifiable</text>
    <circle cx="560" cy="290" r="32" fill="#bfdbfe" opacity="0.75"/><text x="560" y="286" font-size="13" fill="#1d4ed8">VLESS+TLS</text><text x="560" y="302" font-size="10" fill="#2563eb">mainstream</text>
    <circle cx="590" cy="225" r="30" fill="#bfdbfe" opacity="0.75"/><text x="590" y="221" font-size="13" fill="#1d4ed8">Trojan</text><text x="590" y="237" font-size="10" fill="#2563eb">HTTPS disguise</text>
    <circle cx="720" cy="160" r="42" fill="#86efac" opacity="0.8"/><text x="720" y="154" font-size="14" font-weight="700" fill="#14532d">VLESS+Reality</text><text x="720" y="172" font-size="11" fill="#166534">top stealth</text>
    <circle cx="755" cy="105" r="36" fill="#4ade80" opacity="0.85"/><text x="755" y="99" font-size="14" font-weight="700" fill="#14532d">Hysteria2</text><text x="755" y="116" font-size="11" fill="#166534">QUIC fastest</text>
    <circle cx="660" cy="120" r="28" fill="#bbf7d0" opacity="0.75"/><text x="660" y="116" font-size="13" fill="#166534">TUIC v5</text><text x="660" y="132" font-size="10" fill="#15803d">QUIC</text>
  </g>

  <text x="450" y="548" font-family="'Space Grotesk',sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Bubble positions are qualitative; real-world results vary by network</text>
  <defs>
    <marker id="arrQ" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
