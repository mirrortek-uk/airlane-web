<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="52" text-anchor="middle" font-family="Space Grotesk, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#0f172a">「美国环境」的五层模型</text>
  <g font-family="JetBrains Mono, monospace">
    <!-- layer 1 -->
    <rect x="110" y="90" width="680" height="66" rx="14" fill="#6366f1"/>
    <text x="150" y="118" font-size="16" font-weight="700" fill="#ffffff">1. 网络层 Network</text>
    <text x="150" y="142" font-size="14" fill="#e0e7ff">US IP · DNS · IPv4/IPv6 · WebRTC · UDP</text>
    <text x="770" y="130" text-anchor="end" font-size="15" fill="#ffffff">✅ 可完全控制</text>
    <!-- layer 2 -->
    <rect x="110" y="170" width="680" height="66" rx="14" fill="#818cf8"/>
    <text x="150" y="198" font-size="16" font-weight="700" fill="#ffffff">2. 设备层 Device</text>
    <text x="150" y="222" font-size="14" fill="#e0e7ff">系统地区 · 语言 · 时区 · 定位</text>
    <text x="770" y="210" text-anchor="end" font-size="15" fill="#ffffff">✅ PC 基本可控</text>
    <!-- layer 3 -->
    <rect x="110" y="250" width="680" height="66" rx="14" fill="#f59e0b"/>
    <text x="150" y="278" font-size="16" font-weight="700" fill="#ffffff">3. 浏览器层 Browser</text>
    <text x="150" y="302" font-size="14" fill="#fef3c7">独立 Profile · Cookie · 指纹 · WebRTC</text>
    <text x="770" y="290" text-anchor="end" font-size="15" fill="#ffffff">⚠️ 可显著降低差异</text>
    <!-- layer 4 -->
    <rect x="110" y="330" width="680" height="66" rx="14" fill="#94a3b8"/>
    <text x="150" y="358" font-size="16" font-weight="700" fill="#ffffff">4. 账号层 Account</text>
    <text x="150" y="382" font-size="14" fill="#e2e8f0">Google / Apple / 历史位置记录</text>
    <text x="770" y="370" text-anchor="end" font-size="15" fill="#ffffff">⚠️ 只能新建账号</text>
    <!-- layer 5 -->
    <rect x="110" y="410" width="680" height="66" rx="14" fill="#334155"/>
    <text x="150" y="438" font-size="16" font-weight="700" fill="#ffffff">5. 出口类型 Exit Type</text>
    <text x="150" y="462" font-size="14" fill="#cbd5e1">住宅 IP Residential vs 数据中心 Datacenter</text>
    <text x="770" y="450" text-anchor="end" font-size="15" fill="#ffffff">取决于资源</text>
  </g>
</svg>
