<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0f172a"/>
  <text x="600" y="120" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="54" font-weight="700" fill="#f1f5f9" text-anchor="middle">代理协议前世今生</text>
  <text x="600" y="170" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#94a3b8" text-anchor="middle">从 Shadowsocks 到 VLESS + Reality 的演化史</text>

  <!-- timeline -->
  <line x1="120" y1="340" x2="1080" y2="340" stroke="#334155" stroke-width="3"/>

  <!-- era dots -->
  <g font-family="'JetBrains Mono',monospace" font-size="15" text-anchor="middle">
    <circle cx="180" cy="340" r="10" fill="#64748b"/>
    <text x="180" y="310" fill="#94a3b8" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="16">2012</text>
    <text x="180" y="390" fill="#cbd5e1" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="18">Shadowsocks</text>

    <circle cx="370" cy="340" r="10" fill="#818cf8"/>
    <text x="370" y="310" fill="#a5b4fc" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="16">2016</text>
    <text x="370" y="390" fill="#cbd5e1" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="18">V2Ray / VMess</text>

    <circle cx="560" cy="340" r="10" fill="#818cf8"/>
    <text x="560" y="310" fill="#a5b4fc" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="16">2019-2020</text>
    <text x="560" y="390" fill="#cbd5e1" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="18">Trojan / VLESS / Xray</text>

    <circle cx="750" cy="340" r="12" fill="#22c55e"/>
    <text x="750" y="310" fill="#86efac" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="16">2022</text>
    <text x="750" y="390" fill="#bbf7d0" font-family="'Space Grotesk','Ping Fang SC','Microsoft YaHei',sans-serif" font-size="18">Reality / Hy2 / SS2022</text>

    <circle cx="960" cy="340" r="12" fill="#f59e0b"/>
    <text x="960" y="310" fill="#fcd34d" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="16">2023-now</text>
    <text x="960" y="390" fill="#fde68a" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="18">sing-box / mihomo</text>
  </g>

  <rect x="330" y="470" width="540" height="76" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="600" y="518" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#c7d2fe" text-anchor="middle">AirLane：一个客户端，装下整部演化史</text>
</svg>
