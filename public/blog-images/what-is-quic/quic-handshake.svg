<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" fill="url(#bg)" rx="16"/>
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600" fill="#1e293b">QUIC：握手与加密合二为一，1 RTT 即可传输</text>
  <!-- Client -->
  <line x1="120" y1="70" x2="120" y2="370" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="120" y="65" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748b">Client</text>
  <!-- Server -->
  <line x1="780" y1="70" x2="780" y2="370" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="780" y="65" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748b">Server</text>
  <!-- QUIC Initial (ClientHello + TLS) -->
  <line x1="120" y1="110" x2="780" y2="150" stroke="#6366f1" stroke-width="2.5"/>
  <text x="450" y="120" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6366f1">Initial (ClientHello + TLS params)</text>
  <!-- QUIC Handshake (ServerHello + Cert + Finished) -->
  <line x1="780" y1="150" x2="120" y2="190" stroke="#6366f1" stroke-width="2.5"/>
  <text x="450" y="160" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6366f1">Handshake (ServerHello + Cert + Finished)</text>
  <!-- Label: 1 RTT -->
  <rect x="330" y="105" width="240" height="22" rx="11" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="450" y="120" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6366f1">Combined QUIC + TLS 1.3: 1 RTT</text>
  <!-- Data -->
  <line x1="120" y1="210" x2="780" y2="240" stroke="#22c55e" stroke-width="2.5"/>
  <text x="450" y="220" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22c55e">HTTP Data (already encrypted)</text>
  <!-- 0-RTT box -->
  <rect x="200" y="270" width="500" height="90" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="295" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#92400e">0-RTT 重连场景</text>
  <text x="450" y="320" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#92400e">客户端缓存了之前的握手参数</text>
  <text x="450" y="340" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#92400e">第一个包即可携带应用数据 — 0 RTT</text>
  <!-- Total -->
  <text x="450" y="385" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#22c55e">首次连接 1 RTT · 重连 0 RTT</text>
</svg>
