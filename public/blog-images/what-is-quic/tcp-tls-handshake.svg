<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" fill="url(#bg)" rx="16"/>
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600" fill="#1e293b">TCP + TLS：多轮握手才能传输数据</text>
  <!-- Client -->
  <line x1="120" y1="70" x2="120" y2="370" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="120" y="65" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748b">Client</text>
  <!-- Server -->
  <line x1="780" y1="70" x2="780" y2="370" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="780" y="65" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748b">Server</text>
  <!-- TCP SYN -->
  <line x1="120" y1="100" x2="780" y2="130" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="108" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#3b82f6">SYN</text>
  <!-- TCP SYN-ACK -->
  <line x1="780" y1="130" x2="120" y2="160" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="138" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#3b82f6">SYN-ACK</text>
  <!-- TCP ACK -->
  <line x1="120" y1="160" x2="780" y2="190" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#3b82f6">ACK</text>
  <!-- Label: 1 RTT -->
  <rect x="350" y="95" width="200" height="20" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="450" y="190" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#3b82f6">TCP Handshake: 1 RTT</text>
  <!-- TLS ClientHello -->
  <line x1="120" y1="210" x2="780" y2="240" stroke="#8b5cf6" stroke-width="2"/>
  <text x="450" y="218" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b5cf6">ClientHello</text>
  <!-- TLS ServerHello + Cert -->
  <line x1="780" y1="240" x2="120" y2="270" stroke="#8b5cf6" stroke-width="2"/>
  <text x="450" y="248" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b5cf6">ServerHello + Certificate</text>
  <!-- TLS ClientKeyExchange + Finished -->
  <line x1="120" y1="270" x2="780" y2="300" stroke="#8b5cf6" stroke-width="2"/>
  <text x="450" y="278" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b5cf6">KeyExchange + Finished</text>
  <!-- TLS Server Finished -->
  <line x1="780" y1="300" x2="120" y2="330" stroke="#8b5cf6" stroke-width="2"/>
  <text x="450" y="308" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b5cf6">Finished</text>
  <!-- Label: 2 RTT -->
  <rect x="350" y="205" width="200" height="20" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="450" y="330" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b5cf6">TLS Handshake: 2 RTT</text>
  <!-- Data -->
  <line x1="120" y1="350" x2="780" y2="370" stroke="#22c55e" stroke-width="2.5"/>
  <text x="450" y="358" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22c55e">HTTP Data</text>
  <!-- Total -->
  <text x="450" y="392" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#ef4444">总计 3 RTT 才能发送第一个数据包</text>
</svg>
