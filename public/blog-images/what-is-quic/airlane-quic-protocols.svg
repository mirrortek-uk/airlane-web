<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="900" height="420" fill="url(#bg)" rx="16"/>
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600" fill="#1e293b">AirLane 中基于 QUIC 的代理协议</text>
  <!-- Protocol stack diagram -->
  <g transform="translate(150, 70)">
    <!-- Hysteria2 -->
    <rect x="0" y="0" width="280" height="70" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="140" y="28" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" fill="#4f46e5">Hysteria2</text>
    <text x="140" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6366f1">基于 QUIC · 暴力拥塞控制 · 高速传输</text>
  </g>
  <g transform="translate(470, 70)">
    <!-- TUIC v5 -->
    <rect x="0" y="0" width="280" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="140" y="28" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" fill="#92400e">TUIC v5</text>
    <text x="140" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b">基于 QUIC · 低延迟 · UDP 恶化场景优势</text>
  </g>
  <!-- QUIC layer -->
  <rect x="150" y="160" width="600" height="50" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="190" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" fill="#1e40af">QUIC (UDP + TLS 1.3)</text>
  <!-- Arrows down -->
  <line x1="290" y1="140" x2="290" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <line x1="610" y1="140" x2="610" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <!-- UDP layer -->
  <rect x="150" y="230" width="600" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="450" y="260" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" fill="#475569">UDP</text>
  <line x1="450" y1="210" x2="450" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <!-- AirLane layer -->
  <rect x="100" y="310" width="700" height="80" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="340" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#f8fafc">AirLane 可视化策略编排</text>
  <text x="450" y="365" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">自动选择最优协议 · 可视化决策追踪 · 出口资源池管理</text>
  <!-- Arrows -->
  <line x1="450" y1="280" x2="450" y2="310" stroke="#6366f1" stroke-width="2"/>
  <text x="470" y="300" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6366f1">sing-box 内核</text>
</svg>
