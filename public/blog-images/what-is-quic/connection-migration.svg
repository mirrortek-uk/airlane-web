<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="900" height="380" fill="url(#bg)" rx="16"/>
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600" fill="#1e293b">连接迁移：QUIC 让网络切换不断线</text>
  <!-- Phone 1 (WiFi) -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="120" height="200" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="30" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#1e40af">WiFi</text>
    <text x="60" y="55" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#3b82f6">IP: 192.168.1.5</text>
    <text x="60" y="100" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">CID: 0x4a8f...</text>
    <text x="60" y="140" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#475569">连接中</text>
    <text x="60" y="165" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22c55e">● 活跃</text>
  </g>
  <!-- Arrow -->
  <g transform="translate(230, 170)">
    <path d="M 0 0 L 80 0 M 70 -8 L 80 0 L 70 8" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
    <text x="40" y="-15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b">切换网络</text>
  </g>
  <!-- Phone 2 (5G) -->
  <g transform="translate(340, 80)">
    <rect x="0" y="0" width="120" height="200" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="60" y="30" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#92400e">5G 移动网络</text>
    <text x="60" y="55" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b">IP: 10.0.2.18</text>
    <text x="60" y="100" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">CID: 0x4a8f...</text>
    <text x="60" y="140" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#475569">连接保持</text>
    <text x="60" y="165" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22c55e">● 活跃</text>
  </g>
  <!-- Server -->
  <g transform="translate(620, 120)">
    <rect x="0" y="0" width="160" height="120" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="80" y="30" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#4f46e5">Server</text>
    <text x="80" y="55" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6366f1">识别 CID</text>
    <text x="80" y="75" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6366f1">而非 IP 地址</text>
    <text x="80" y="100" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22c55e">连接不断</text>
  </g>
  <!-- Lines from phones to server -->
  <path d="M 200 180 Q 400 140 620 180" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="6,4"/>
  <path d="M 460 180 Q 540 160 620 180" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="6,4"/>
  <!-- Bottom explanation -->
  <rect x="100" y="310" width="700" height="55" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="450" y="332" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#15803d">QUIC 使用连接 ID (CID) 标识连接，而非 IP 地址</text>
  <text x="450" y="352" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#15803d">从 WiFi 切到 5G，IP 变了但连接不中断 — 代理隧道保持不断</text>
</svg>
