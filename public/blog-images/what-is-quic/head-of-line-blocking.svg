<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="900" height="420" fill="url(#bg)" rx="16"/>
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600" fill="#1e293b">队头阻塞对比：TCP vs QUIC</text>
  <!-- Left: TCP -->
  <text x="225" y="70" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" fill="#ef4444">TCP（队头阻塞）</text>
  <g transform="translate(50, 85)">
    <!-- Stream 1 -->
    <rect x="0" y="0" width="350" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="175" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#dc2626">Stream 1: 请求 A</text>
    <!-- Stream 2 blocked -->
    <rect x="0" y="40" width="350" height="30" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="175" y="60" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#dc2626">Stream 2: 请求 B ⏳ 等待 A 完成</text>
    <!-- Stream 3 blocked -->
    <rect x="0" y="80" width="350" height="30" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="175" y="100" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#dc2626">Stream 3: 请求 C ⏳ 等待 A 完成</text>
    <!-- Packet loss indicator -->
    <rect x="0" y="130" width="350" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="175" y="150" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#92400e">⚠ Stream 1 丢包 → 所有流阻塞</text>
  </g>
  <!-- Right: QUIC -->
  <text x="675" y="70" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" fill="#6366f1">QUIC（无队头阻塞）</text>
  <g transform="translate(500, 85)">
    <!-- Stream 1 -->
    <rect x="0" y="0" width="350" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
    <text x="175" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#4f46e5">Stream 1: 请求 A</text>
    <!-- Stream 2 independent -->
    <rect x="0" y="40" width="350" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
    <text x="175" y="60" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#4f46e5">Stream 2: 请求 B ✅ 独立传输</text>
    <!-- Stream 3 independent -->
    <rect x="0" y="80" width="350" height="30" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
    <text x="175" y="100" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#4f46e5">Stream 3: 请求 C ✅ 独立传输</text>
    <!-- Packet loss indicator -->
    <rect x="0" y="130" width="350" height="30" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="175" y="150" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#15803d">✓ Stream 1 丢包 → 仅重传 A，B/C 不受影响</text>
  </g>
  <!-- Divider -->
  <line x1="450" y1="80" x2="450" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Bottom explanation -->
  <text x="450" y="270" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#475569">TCP 中所有 HTTP/2 流共享一个 TCP 连接，一个丢包阻塞全部</text>
  <text x="450" y="295" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#475569">QUIC 中每个流独立处理丢包重传，互不阻塞</text>
  <!-- AirLane context -->
  <rect x="150" y="330" width="600" height="70" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="355" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#4f46e5">AirLane 中的应用</text>
  <text x="450" y="378" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6366f1">Hysteria2 / TUIC v5 基于 QUIC，在高丢包网络中表现远优于 TCP 代理</text>
</svg>
