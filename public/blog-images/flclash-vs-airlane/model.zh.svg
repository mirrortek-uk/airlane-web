<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="480" fill="#f8fafc" rx="16"/>

  <!-- FlClash / mihomo model -->
  <text x="225" y="42" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#0f766e" text-anchor="middle">FlClash（mihomo 模型）</text>
  <rect x="60" y="60" width="330" height="56" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="225" y="94" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#134e4a" text-anchor="middle">规则列表（自上而下匹配）</text>
  <line x1="225" y1="116" x2="225" y2="142" stroke="#64748b" stroke-width="2" marker-end="url(#arrT)"/>
  <rect x="60" y="142" width="330" height="56" rx="10" fill="#99f6e4" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="225" y="176" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#134e4a" text-anchor="middle">代理组 ProxyGroup（SELECT / URL-TEST）</text>
  <line x1="225" y1="198" x2="225" y2="224" stroke="#64748b" stroke-width="2" marker-end="url(#arrT)"/>
  <rect x="60" y="224" width="330" height="56" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="225" y="258" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#134e4a" text-anchor="middle">具体节点</text>
  <text x="225" y="320" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748b" text-anchor="middle">调试手段：日志 + 手动测试</text>
  <text x="225" y="345" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748b" text-anchor="middle">“流量是谁、走哪组” 混在一处</text>

  <!-- divider -->
  <line x1="450" y1="50" x2="450" y2="430" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- AirLane model -->
  <text x="675" y="42" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">AirLane（四层策略树）</text>
  <g font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" text-anchor="middle">
    <rect x="500" y="56" width="350" height="44" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="675" y="84" fill="#92400e">① 分类器：这是什么流量？</text>
    <line x1="675" y1="100" x2="675" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#arrA)"/>
    <rect x="500" y="118" width="350" height="44" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="675" y="146" fill="#92400e">② 行为：Route / Direct / Block</text>
    <line x1="675" y1="162" x2="675" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrA)"/>
    <rect x="500" y="180" width="350" height="44" rx="10" fill="#fcd34d" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="675" y="208" fill="#78350f">③ 策略：绑定出口池（测速/均衡/容灾）</text>
    <line x1="675" y1="224" x2="675" y2="242" stroke="#64748b" stroke-width="2" marker-end="url(#arrA)"/>
    <rect x="500" y="242" width="350" height="44" rx="10" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="675" y="270" fill="#451a03">④ 出口池：地区分组 / PoolVIP / Mesh 节点</text>
  </g>
  <rect x="500" y="312" width="350" height="62" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="675" y="338" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#9a3412" text-anchor="middle">决策追踪：每跳可回放 · 命中分析</text>
  <text x="675" y="362" font-family="'Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#9a3412" text-anchor="middle">健康监测：异常自动切换出口</text>

  <defs>
    <marker id="arrT" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
  </defs>
</svg>
