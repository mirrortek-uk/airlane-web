<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <text x="600" y="150" font-family="'Space Grotesk',sans-serif" font-size="56" font-weight="700" fill="#f1f5f9" text-anchor="middle">FlClash vs AirLane</text>
  <text x="600" y="205" font-family="'Space Grotesk',sans-serif" font-size="30" fill="#94a3b8" text-anchor="middle">Two rule-based proxy clients, two very different models</text>

  <!-- FlClash card -->
  <rect x="130" y="260" width="440" height="230" rx="18" fill="#134e4a" stroke="#14b8a6" stroke-width="2"/>
  <text x="350" y="320" font-family="'Space Grotesk',sans-serif" font-size="38" font-weight="700" fill="#99f6e4" text-anchor="middle">FlClash</text>
  <text x="350" y="365" font-family="'JetBrains Mono',monospace" font-size="24" fill="#5eead4" text-anchor="middle">mihomo core · open source</text>
  <text x="350" y="415" font-family="'Space Grotesk',sans-serif" font-size="24" fill="#ccfbf1" text-anchor="middle">Proxy groups + rule list, light &amp; free</text>
  <text x="350" y="455" font-family="'Space Grotesk',sans-serif" font-size="22" fill="#2dd4bf" text-anchor="middle">Classic Rule Client</text>

  <!-- VS -->
  <circle cx="600" cy="375" r="44" fill="#f59e0b"/>
  <text x="600" y="390" font-family="'Space Grotesk',sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="middle">VS</text>

  <!-- AirLane card -->
  <rect x="630" y="260" width="440" height="230" rx="18" fill="#431407" stroke="#f59e0b" stroke-width="2"/>
  <text x="850" y="320" font-family="'Space Grotesk',sans-serif" font-size="38" font-weight="700" fill="#fde68a" text-anchor="middle">AirLane</text>
  <text x="850" y="365" font-family="'JetBrains Mono',monospace" font-size="24" fill="#fcd34d" text-anchor="middle">sing-box core</text>
  <text x="850" y="415" font-family="'Space Grotesk',sans-serif" font-size="24" fill="#fef3c7" text-anchor="middle">Policy tree + decision trace + pools</text>
  <text x="850" y="455" font-family="'Space Grotesk',sans-serif" font-size="22" fill="#fbbf24" text-anchor="middle">Network Orchestration</text>

  <text x="600" y="540" font-family="'Space Grotesk',sans-serif" font-size="22" fill="#64748b" text-anchor="middle">airlane.cloud</text>
</svg>
