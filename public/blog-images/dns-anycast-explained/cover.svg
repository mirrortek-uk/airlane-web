<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Globe with nodes -->
  <g transform="translate(800, 315)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="180" ry="80" fill="none" stroke="#334155" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="180" ry="40" fill="none" stroke="#334155" stroke-width="1"/>
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#334155" stroke-width="1"/>
    <!-- Anycast nodes -->
    <circle cx="-80" cy="-60" r="12" fill="#6366f1"/>
    <circle cx="-80" cy="-60" r="22" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.4"/>
    <text x="-80" y="-80" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a5b4fc">Node A</text>
    <circle cx="90" cy="40" r="12" fill="#f59e0b"/>
    <circle cx="90" cy="40" r="22" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="90" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24">Node B</text>
    <circle cx="20" cy="-100" r="12" fill="#22c55e"/>
    <circle cx="20" cy="-100" r="22" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
    <text x="20" y="-120" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#86efac">Node C</text>
    <!-- Same IP label -->
    <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">同一 IP</text>
  </g>
  <!-- Client -->
  <g transform="translate(150, 250)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="50" y="35" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#e2e8f0">Client</text>
  </g>
  <!-- Query arrow -->
  <path d="M 250 280 Q 400 200 600 280" stroke="#6366f1" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  <text x="400" y="230" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a5b4fc">DNS Query → 最近节点</text>
  <!-- Title -->
  <text x="100" y="400" font-family="'Space Grotesk', sans-serif" font-size="48" font-weight="700" fill="#f8fafc">DNS Anycast</text>
  <text x="100" y="450" font-family="'Space Grotesk', sans-serif" font-size="24" fill="#94a3b8">一个 IP，多个节点，自动选最近的</text>
  <text x="100" y="500" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#64748b">AirLane 博客 · 网络技术详解</text>
</svg>
