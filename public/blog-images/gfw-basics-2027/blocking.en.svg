<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="400" fill="#f8fafc" rx="16"/>
  <text x="450" y="40" font-family="'Space Grotesk',sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">Four ways the firewall blocks you</text>

  <!-- blocked lane -->
  <text x="80" y="95" font-family="'Space Grotesk',sans-serif" font-size="15" fill="#94a3b8">Plain request</text>
  <g font-family="'Space Grotesk',sans-serif" font-size="14" text-anchor="middle">
    <rect x="70" y="110" width="170" height="56" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="155" y="133" fill="#991b1b">1. DNS poisoning</text>
    <text x="155" y="153" fill="#b91c1c" font-size="12">returns a wrong IP</text>
    <rect x="270" y="110" width="170" height="56" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="355" y="133" fill="#991b1b">2. IP blocking</text>
    <text x="355" y="153" fill="#b91c1c" font-size="12">packets dropped</text>
    <rect x="470" y="110" width="170" height="56" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="555" y="133" fill="#991b1b">3. SNI / DPI probes</text>
    <text x="555" y="153" fill="#b91c1c" font-size="12">inspects domain &amp; fingerprint</text>
    <rect x="670" y="110" width="170" height="56" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="755" y="133" fill="#991b1b">4. Connection reset</text>
    <text x="755" y="153" fill="#b91c1c" font-size="12">RST kills the session</text>
  </g>
  <text x="450" y="200" font-family="'Space Grotesk',sans-serif" font-size="14" fill="#b91c1c" text-anchor="middle">→ Symptoms: timeouts, resets, 404s, wrong IPs</text>

  <!-- encrypted lane -->
  <text x="80" y="255" font-family="'Space Grotesk',sans-serif" font-size="15" fill="#94a3b8">Proxied traffic</text>
  <rect x="70" y="270" width="230" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="185" y="295" font-family="'Space Grotesk',sans-serif" font-size="14" fill="#166534" text-anchor="middle">Encrypted + disguised</text>
  <text x="185" y="316" font-family="'Space Grotesk',sans-serif" font-size="12" fill="#15803d" text-anchor="middle">Reality / Hysteria2 / Trojan…</text>
  <line x1="300" y1="300" x2="360" y2="300" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrB)"/>
  <rect x="360" y="270" width="230" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="475" y="295" font-family="'Space Grotesk',sans-serif" font-size="14" fill="#166534" text-anchor="middle">Unrecognizable to DPI</text>
  <text x="475" y="316" font-family="'Space Grotesk',sans-serif" font-size="12" fill="#15803d" text-anchor="middle">looks like normal HTTPS</text>
  <line x1="590" y1="300" x2="650" y2="300" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrB)"/>
  <rect x="650" y="270" width="190" height="60" rx="10" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
  <text x="745" y="295" font-family="'Space Grotesk',sans-serif" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Reaches the target</text>
  <text x="745" y="316" font-family="'Space Grotesk',sans-serif" font-size="12" fill="#15803d" text-anchor="middle">Google · YouTube · ChatGPT…</text>

  <text x="450" y="370" font-family="'Space Grotesk',sans-serif" font-size="14" fill="#64748b" text-anchor="middle">The battle isn't "getting out" — it's "looking innocent". That's what modern protocols are for.</text>

  <defs>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#22c55e"/></marker>
  </defs>
</svg>
